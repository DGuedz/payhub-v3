<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Payhub v3</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 0; }
      .wrap { display: grid; place-items: center; min-height: 100vh; background: #0f172a; color: #e2e8f0; }
      .card { padding: 24px 28px; border-radius: 12px; background: #111827; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
      .card h1 { margin: 0 0 8px; font-size: 24px; }
      .card p { margin: 0; opacity: 0.9; }
      .ok { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
      .ok:before { content: "✔"; color: #22c55e; }
      .links { margin-top: 14px; display: flex; gap: 12px; }
      a { color: #93c5fd; text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="card">
        <h1>Payhub v3</h1>
        <p class="ok">Deploy ativo</p>
        <div class="links">
          <a href="/api/health">/api/health</a>
        </div>
      </section>
    </main>
  </body>
</html>
