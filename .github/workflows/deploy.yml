name: CI/CD — Build & Deploy (Vercel)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install deps (conditional)
        if: ${{ hashFiles('**/package.json') != '' }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Type check (conditional)
        if: ${{ hashFiles('**/tsconfig.json') != '' }}
        run: |
          npx tsc --noEmit || true

      - name: Lint (optional)
        if: ${{ hashFiles('**/.eslintrc*') != '' }}
        run: |
          npx eslint . || true

      - name: Build (conditional)
        if: ${{ hashFiles('**/package.json') != '' }}
        run: |
          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No build script found; skipping build."
          fi

      - name: Deploy to Vercel (conditional)
        if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_PROJECT_ID != '' && secrets.VERCEL_ORG_ID != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          npm i -g vercel@latest
          # Preview deployments on PRs, Production on push to main
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            vercel deploy --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" --project "$VERCEL_PROJECT_ID" --yes --prod=false --confirm
          else
            vercel deploy --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" --project "$VERCEL_PROJECT_ID" --yes --prod --confirm
          fi

      - name: Deployment info
        if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_PROJECT_ID != '' && secrets.VERCEL_ORG_ID != '' }}
        run: |
          echo "Deployment attempted via Vercel CLI. Check job logs for URL."

      - name: Skip deploy (no secrets)
        if: ${{ !(secrets.VERCEL_TOKEN != '' && secrets.VERCEL_PROJECT_ID != '' && secrets.VERCEL_ORG_ID != '' ) }}
        run: |
          echo "Vercel secrets not configured. Skipping deployment step."